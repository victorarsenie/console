<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MU/TH/UR 6000  -  console</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="boot" class="boot"><div class="boot-inner">
  <div class="boot-line">MU/TH/UR 6000</div>
  <div class="boot-line dim">machine ............... linked</div>
  <div class="boot-line dim">memory layer .......... mounted</div>
  <div class="boot-line dim">board ................. loaded</div>
</div></div>

<div class="wincontrols">
  <button id="win-full" title="toggle fullscreen">&#9974;</button>
  <button id="win-close" class="danger" title="close">&#10005;</button>
</div>

<header class="top">
  <div class="brand">MU/TH/UR 6000</div>
  <div class="sub">operations console</div>
  <div class="spacer"></div>
  <div id="clock" class="clock">--:--:--</div>
  <div id="dot" class="dot"></div>
</header>

<main class="stage">
  <button class="arrow prev" id="prev" aria-label="previous bay"> - </button>
  <div class="track" id="track"></div>
  <button class="arrow next" id="next" aria-label="next bay"> - </button>
</main>

<footer class="foot">
  <span id="toast" class="toast"></span>
  <span class="spacer"></span>
  <span class="hint"><b>1 - 5</b> bay</span>
  <span class="hint"><b> -   - </b> move</span>
  <span class="hint"><b>/</b> commands</span>
  <span class="hint"><b>r</b> refresh</span>
</footer>

<script src="/app.js"></script>
<div id="palette" class="palette" hidden>
  <div class="palette-box">
    <input id="palette-q" placeholder="type a command: card, search, telemetry, start 1, stop 2 ..." autocomplete="off">
    <div id="palette-list" class="palette-list"></div>
  </div>
</div>
</body>
</html>
